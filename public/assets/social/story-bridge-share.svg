  <g transform="translate(750 185) scale(3)"><path d="M6 42 A18 18 0 0 1 42 42M42 42 A18 18 0 0 1 78 42" fill="none" stroke="#1F4D3A" stroke-width="4" stroke-linecap="round"/><line x1="4" y1="42" x2="92" y2="42" stroke="#1F4D3A" stroke-width="4" stroke-linecap="round"/><g fill="#C4663F"><rect x="28" y="52" width="3" height="8" rx="1.5"/><rect x="34" y="49" width="3" height="14" rx="1.5"/><rect x="40" y="46" width="3" height="20" rx="1.5"/><rect x="46" y="50" width="3" height="12" rx="1.5"/><rect x="52" y="47" width="3" height="18" rx="1.5"/><rect x="58" y="51" width="3" height="10" rx="1.5"/><rect x="64" y="48" width="3" height="16" rx="1.5"/></g></g>
