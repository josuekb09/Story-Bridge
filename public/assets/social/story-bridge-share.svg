  <text x="86" y="268" fill="#1D2B24" font-family="Fraunces,Georgia,serif" font-size="58" font-weight="600">Your story, in your</text><text x="86" y="338" fill="#1D2B24" font-family="Fraunces,Georgia,serif" font-size="58" font-weight="600">own voice.</text>
  <text x="86" y="408" fill="#4B5A52" font-family="Inter,Arial,sans-serif" font-size="23">Carried across languages. Shared on your terms.</text>
